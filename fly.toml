app = "destajo-calzado"
primary_region = "mia"   # Miami, más cercano a México

[build]

[env]
  DATABASE_URL = "sqlite:/data/destajo.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Volumen persistente para SQLite
[mounts]
  source = "destajo_data"
  destination = "/data"
